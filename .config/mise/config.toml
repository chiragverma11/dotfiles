[settings]
minimum_release_age_excludes = ["agy", "codex", "npm:@opencode/cli"]

[tools]
agy = "latest"
"aqua:SurgeDM/Surge" = "latest"
bun = "latest"
cloudflared = "latest"
codex = "latest"
gh = "latest"
"github:alltuner/mise-completions-sync" = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "latest"
node = ["lts", "latest"]
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
pnpm = "latest"
uv = "latest"
vercel = { version = "latest", allow_builds = [
  "esbuild",
], trust_policy_excludes = [
  "undici",
] }

[hooks]
postinstall = "misecompsync --new-only --shell zsh"
