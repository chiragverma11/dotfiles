# Font Configuration

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size 12.0

# Window Configuration
window_padding_width 12
background_opacity 0.7
background_blur 32
hide_window_decorations yes
dynamic_background_opacity yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Editor
editor .

# Key bindings for common actions
#umap ctrl+shift+n new_window
map ctrl+t new_tab
map alt+shift+t launch --cwd=current --type=tab
map ctrl+plus change_font_size all +0.5
map ctrl+equal change_font_size all +0.5
map ctrl+minus change_font_size all -0.5
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration no-cursor

# Layouts
# without this line functionality like vsplit, layout rotate, etc will not work
# @see https://sw.kovidgoyal.net/kitty/layouts/#the-splits-layout
enabled_layouts splits:split_axis=horizontal

# Key bindings for splits layout

# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map f5 launch --location=hsplit --cwd=current

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map f6 launch --location=vsplit --cwd=current

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
map f4 launch --location=split --cwd=current

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map f7 layout_action rotate

# Move the active window in the indicated direction
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# Move the active window to the indicated screen edge
map ctrl+shift+up layout_action move_to_screen_edge top
map ctrl+shift+left layout_action move_to_screen_edge left
map ctrl+shift+right layout_action move_to_screen_edge right
map ctrl+shift+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Movement between tabs
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2 
map ctrl+3 goto_tab 3 
map ctrl+4 goto_tab 4 
map ctrl+5 goto_tab 5 
map ctrl+6 goto_tab 6 
map ctrl+7 goto_tab 7 
map ctrl+8 goto_tab 8 
map ctrl+9 goto_tab 9 

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
