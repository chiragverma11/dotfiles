# Kitty quick-access terminal for spotify_player
# Managed via dotfiles. Toggle with Niri Mod+Shift+S:
#   kitten quick-access-terminal --instance-group spotify --detach /home/chirag/.local/bin/spotify_player
# Replaces the old tmux display-popup (nested tmux-in-popup froze Kitty graphics).
#
# Auto-loaded from the kitty config directory as quick-access-terminal.conf;
# do not `include` this from kitty.conf (edge/lines/columns are panel-only keys).

# Centered floating panel sized in cells: 130x32 is roughly 60% of the
# 1536x864 logical screen (the old tmux popup was 90%x85%).
edge center-sized
lines 32
columns 130

background_opacity 0.9
# Hides the panel when it loses keyboard focus. This also forces
# focus_policy to on-demand, so setting focus_policy here is redundant.
hide_on_focus_loss yes

kitty_override window_padding_width=6
